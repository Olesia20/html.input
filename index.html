<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <label for="first-name">Where are you from</label>
      <input type="text" id="first-name" />
    </div>
    <div>
      <input type="number" name="" id="" />
    </div>
    <input type="search" />
    <div>
      <input type="time" name="" id="" />
    </div>
    <input type="color" name="" id="" />
    <form action="/submit">
      <label for="email">What is your email</label>
      <input type="email" name="email" id="email" />
      <input type="submit" name="" id="" />
    </form>
    <div>
      <label for="">Cat or Dog?</label>
      <input type="radio" name="pet" id="cat" value="cat" />
      <label for="cat">Cat</label>
      <input type="radio" name="pet" id="dog" />
      <label for="dog">Dog</label>
      <div>
        <input type="checkbox" name="cats" id="cats" value="cats" />
        <label for="cats">Cats</label>
      </div>
    </div>
    <form action="/submit">
      <label for="countries">Which country would you like travel to?</label>
      <select name="" id="countries">
        <option value="">Select a country</option>
        <option value="ukraine">Ukraine</option>
        <option value="germany">Germany</option>
        <option value="usa">Usa</option>
        <option value="spain">Spain</option>
        <option value="japan">Japan</option>
      </select>
    </form>
    <div>
      <form action="/submit">
        <label for="fruts">What is your favorite fruit?</label>
        <select name="" id="countries">
          <option value="">Select a fruit</option>
          <option value="watermelon">🍉 Watermelon</option>
          <option value="strawberry">🍓 Strawberry</option>
          <option value="usa">🥭 Mango</option>
          <option value="spain">🍇 Grape</option>
          <option value="japan">🥥 Coconut</option>
        </select>
      </form>
    </div>
    <div>
      <label for="primary-colors" id="primary-colors"
        >Choose your favorite color?</label
      >
      <select name="" id="colors">
        <option value="" selected>Choose a color</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="yellow">Yellow</option>
        <option value="green">Green</option>
      </select>
    </div>
    <div id="hello">Hello</div>
    <div id="date"></div>
    <div id="milliseconds"></div>


    
    <script>
      function showSelectedCountry(event) {
        if (event.target.value.length > 0) {
          //   alert(event.target.value);
        }
        if (event.target.value === "ukraine") {
          alert("Вітання");
        }
        if (event.target.value === "germany") {
          alert("Guten Tag");
        }
      }
      let countriesSelector = document.querySelector("#countries");
      countriesSelector.addEventListener("change", showSelectedCountry);
      function showSelectedColor(event) {
        // alert(event.target.value)
        if (event.target.value === "red") {
          alert("❤️");
        }
        if (event.target.value === "blue") {
          alert("💙");
        }
        if (event.target.value === "yellow") {
          alert("💛");
        }
        if (event.target.value === "green") {
          alert("💚");
        }
      }

      let colorSelect = document.querySelector("#colors");
      colorSelect.addEventListener("change", showSelectedColor);

      function sayHello() {
        let helloBox = document.querySelector("#hello");
        helloBox.innerHTML = "Guten Tag";
      }

      function displayDate() {
        let date = document.querySelector("#date");
        date.innerHTML = new Date();
        console.log();
      }
      setTimeout(sayHello, 3000);
      setInterval(displayDate, 1000);
      function displayMillisecond() {
        let date = new Date();
        let millisecomds = document.querySelector("#milliseconds");
        millisecomds.innerHTML = date.getMilliseconds();
      }
      setInterval(displayMillisecond, 100);
      //   console.log(date.getMilliseconds());
    </script>
  </body>
</html>
